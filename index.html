<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Age of Absurdity — Charleen Johnson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eaf9f8; --bg-card: #ffffff; --bg-hover: #d8f4f3; --bg-section: #f4fdfb;
      --teal-deep: #008b87; --teal-mid: #4FBDBA; --teal-rule: rgba(0,139,135,0.18);
      --orange: #E6A600; --coral: #ff6f61; --charcoal: #1a1a2e; --white: #ffffff;
      --body-text: #2a4a48; --muted: #5a8a87;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Montserrat', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--body-text); font-family: var(--sans); font-weight: 300; line-height: 1.7; -webkit-font-smoothing: antialiased; }
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 1.1rem 2.5rem; display: flex; justify-content: space-between; align-items: center; transition: background 0.3s, border-color 0.3s; background: rgba(234,249,248,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid transparent; }
    nav.scrolled { background: rgba(234,249,248,0.96); border-bottom-color: var(--teal-rule); }
    .nav-wordmark { font-family: var(--serif); font-weight: 300; font-size: 0.95rem; letter-spacing: 0.06em; color: var(--muted); text-decoration: none; }
    .nav-wordmark span { color: var(--teal-deep); font-weight: 400; }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover { color: var(--teal-deep); }
    #progress-bar { position: fixed; top: 0; left: 0; height: 2px; width: 0%; background: var(--teal-mid); z-index: 200; transition: width 0.1s linear; }
    .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 9rem 2rem 5rem; position: relative; overflow: hidden; }
    #field-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.55; }
    .hero-inner { position: relative; z-index: 2; max-width: 820px; margin: 0 auto; width: 100%; }
    .hero-eyebrow { font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--teal-deep); margin-bottom: 1.75rem; opacity: 0; animation: fadeUp 0.8s ease forwards 0.1s; }
    .hero-title { font-family: var(--serif); font-size: clamp(3.5rem, 7.5vw, 6rem); font-weight: 300; line-height: 1.05; color: var(--charcoal); margin-bottom: 2rem; opacity: 0; animation: fadeUp 0.9s ease forwards 0.25s; }
    .hero-title em { font-style: italic; color: var(--teal-deep); }
    .hero-signal { border-left: 3px solid var(--teal-deep); padding: 1.25rem 1.75rem; background: rgba(255,255,255,0.7); max-width: 580px; margin-bottom: 3rem; }
    .signal-line { font-family: var(--serif); font-size: 1.2rem; font-style: italic; color: var(--charcoal); line-height: 1.6; display: block; opacity: 0; }
    .signal-line.visible { animation: fadeUp 0.7s ease forwards; }
    .signal-line + .signal-line { margin-top: 0.2rem; }
    .hero-cta { display: flex; gap: 1.25rem; flex-wrap: wrap; opacity: 0; animation: fadeUp 0.9s ease forwards 1.9s; }
    .btn { display: inline-block; padding: 0.8rem 1.9rem; font-family: var(--sans); font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; border-radius: 2px; transition: all 0.25s; font-weight: 400; }
    .btn-primary { background: var(--teal-deep); color: var(--white); }
    .btn-primary:hover { background: #006f6b; transform: translateY(-2px); }
    .btn-field { background: var(--orange); color: var(--white); }
    .btn-field:hover { background: #c48f00; transform: translateY(-2px); }
    .btn-secondary { background: transparent; color: var(--teal-deep); border: 1px solid var(--teal-rule); }
    .btn-secondary:hover { border-color: var(--teal-deep); background: rgba(0,139,135,0.06); }
    .container { max-width: 820px; margin: 0 auto; padding: 0 2rem; }
    .section-rule { border: none; border-top: 1px solid var(--teal-rule); }
    .section-label { font-size: 0.68rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--teal-deep); margin-bottom: 2.5rem; }
    .what-section { padding: 6rem 0; }
    .what-body { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem 4rem; }
    .what-body p { font-size: 1rem; color: var(--body-text); line-height: 1.85; }
    .what-body p + p { margin-top: 1rem; }
    .what-body a { color: var(--teal-deep); text-decoration: none; border-bottom: 1px solid var(--teal-rule); transition: border-color 0.2s; }
    .what-body a:hover { border-color: var(--teal-deep); }
    .rumi-section { padding: 4rem 0; }
    .rumi-quote { text-align: center; max-width: 600px; margin: 0 auto; }
    .rumi-quote blockquote { font-family: var(--serif); font-size: clamp(1.3rem, 2.5vw, 1.7rem); font-style: italic; font-weight: 300; color: var(--charcoal); line-height: 1.55; margin-bottom: 1rem; }
    .rumi-quote cite { font-size: 0.78rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); font-style: normal; }
    .essays-section { padding: 6rem 0; background: var(--bg-section); }
    .essays-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2.5rem; }
    .essays-title { font-family: var(--serif); font-size: 2rem; font-weight: 300; color: var(--charcoal); }
    .reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .essay-card { display: block; background: var(--bg-card); border: 1px solid rgba(0,139,135,0.12); border-radius: 3px; padding: 1.75rem 2.25rem; margin-bottom: 2px; text-decoration: none; transition: all 0.28s; position: relative; overflow: hidden; }
